apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: REPLACE_ME_BACKEND
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: SECRET_ID
              value: my-rds-secret       # 👈 must match the Secrets Manager secret name
            - name: AWS_REGION
              value: us-west-2
            - name: CACHE_TTL_SECONDS
              value: "600"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
